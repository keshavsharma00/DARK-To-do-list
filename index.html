<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="box">
        <h2>To-Do List</h2>
        
        <form id="form">
          
            <input type="text" id="input" placeholder="Add a new task..." autocomplete="off" required>
            <button type="submit">Add</button>
        </form>

        <ul id="list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
